[project]
name = "Pacman"
version = "0.1.0"
description = "Summary: Recreate the famous arcade game Pac-man! - Version: 1.5"
readme = "README.md"
authors = [
    { name = "Federica Guglielmucci", email = "fedegugl@student.42firenze.it" },
    { name = "Gianluca Cerretelli", email = "gcerrete@c1r4p8.42firenze.it" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "flake8>=7.1",
    "mypy>=1.14",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false
